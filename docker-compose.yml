services:
  moyu:
    build: .
    image: moyu:latest
    container_name: moyu
    # 默认只绑定本机（安全）；要公网访问，在 .env 里设 BIND_HOST=0.0.0.0
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PORT:-8000}:8000"
    environment:
      # 未设置时会直接报错并提示（避免用默认密钥上线，否则会话可被伪造）
      SECRET_KEY: ${SECRET_KEY:?请先 cp .env.example .env 并设置一个随机的 SECRET_KEY}
      TYPING_SPEED: ${TYPING_SPEED:-1.0}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      # 命名卷：Docker 会用镜像内 /data、/novels 的属主(moyu)初始化，非 root 容器可直接写入
      - moyu-data:/data
      - moyu-novels:/novels
    restart: unless-stopped

volumes:
  moyu-data:
  moyu-novels: